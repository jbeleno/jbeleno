name: tic-tac-toe

on:
  issues:
    types: [opened]

# one move at a time, in order
concurrency:
  group: tictactoe
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest state, not the SHA from when the issue was opened

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python game/ttt.py --title "$TITLE" --player "$PLAYER" --comment-file "$RUNNER_TEMP/comment.md"

      - name: Commit board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ttt: move by @$PLAYER (#$NUMBER)"
          for i in 1 2 3; do git push && break; git pull --rebase; done

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
